<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary-fixed-dim": "#b7c8e3", "surface-container-lowest": "#ffffff", "surface-tint": "#4f5f77", "on-tertiary-fixed": "#002115", "tertiary-container": "#002c1d", "on-secondary-container": "#4a637e", "on-surface-variant": "#44474d", "on-secondary-fixed-variant": "#2f4962", "outline-variant": "#c4c6cd", "primary-fixed": "#d3e4ff", "inverse-surface": "#213145", "on-primary-container": "#7d8da7", "surface-container-highest": "#d3e4fe", "on-error-container": "#93000a", "on-surface": "#0b1c30", "on-primary-fixed": "#0a1c31", "on-primary-fixed-variant": "#37485e", "on-tertiary-fixed-variant": "#005139", "secondary": "#47617b", "on-error": "#ffffff", "outline": "#74777d", "surface-bright": "#f8f9ff", "on-primary": "#ffffff", "surface-container": "#e5eeff", "tertiary-fixed": "#7ff9c7", "tertiary-fixed-dim": "#61dcac", "surface-container-low": "#eff4ff", "background": "#f8f9ff", "inverse-on-surface": "#eaf1ff", "on-secondary-fixed": "#001d34", "secondary-fixed-dim": "#afc9e8", "surface": "#f8f9ff", "surface-container-high": "#dce9ff", "on-tertiary-container": "#09a075", "on-tertiary": "#ffffff", "on-background": "#0b1c30", "secondary-container": "#c5dfff", "on-secondary": "#ffffff", "error-container": "#ffdad6", "inverse-primary": "#b7c8e3", "primary-container": "#15263b", "primary": "#001125", "error": "#ba1a1a", "surface-variant": "#d3e4fe", "tertiary": "#00140c", "surface-dim": "#cbdbf5", "secondary-fixed": "#cfe4ff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xxs": "0.125rem", "space-sm": "0.5rem", "margin-compact": "1rem", "gutter": "1rem", "space-xl": "1.5rem", "space-xs": "0.25rem", "gutter-compact": "0.5rem", "space-lg": "1rem", "space-2xl": "2rem", "margin": "1.5rem", "space-md": "0.75rem" }, fontFamily: { "label-md": ["Inter"], "body-sm": ["Inter"], "display-lg": ["Inter"], "code-sm": ["JetBrains Mono"], "title-md": ["Inter"], "code-md": ["JetBrains Mono"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"] }, fontSize: { "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "code-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0em", "fontWeight": "500" }], "title-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "600" }], "code-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "500" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600" }] } } } }</style><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface flex-grow"><div class="flex flex-col w-full px-margin-compact py-space-md select-none">
  <!-- Brand Showcase Area -->
  <div class="flex flex-col items-center text-center mt-space-sm mb-space-lg">
    <div class="relative flex items-center justify-center w-20 h-20 bg-primary-container rounded-2xl shadow-md mb-space-md group">
      <div class="absolute inset-0 rounded-2xl bg-gradient-to-tr from-tertiary-container/30 via-transparent to-surface-container-highest/20 pointer-events-none"></div>
      <img src="https://lh3.googleusercontent.com/aida/AEtjO1WA2PwUHnv-gOy1sGtDd2P8L_HQ29mbi3sjPSUjmMJTNrnYQrNhcwJVjIEQV0h-3BHwtnEL25TrG9Og516achgZaEZPlnKOw3KbmseEom3yjlC5pmHtNWLgB5VsyRYuXgt-SbRWu9OB9vMQnbwL7Tt3g8Ch89Yq8gmxe3z9KJMyjiF2YXD2SrsAk9b_PBetca9r8HovwsGXIHOgL_xWKgDZW-Gh0XUtPp8KMbVMTs6u96BuOaLQlqoLKEQ" alt="LabStock Technical Brand Emblem" class="w-12 h-12 object-contain relative z-10 drop-shadow-sm transition-transform duration-300 transform group-hover:scale-105" />
      <span class="absolute -top-1 -right-1 flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary-fixed opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-on-tertiary-container"></span>
      </span>
    </div>

    <div class="flex items-center gap-space-xs mb-space-xxs">
      <span class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold">LabStock</span>
      <span class="px-space-xs py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-code-sm text-code-sm uppercase tracking-wider font-semibold">CORE</span>
    </div>
    
    <p class="font-body-sm text-body-sm text-on-surface-variant max-w-[260px] leading-snug">
      Laboratory Inventory &amp; Spare Parts Management
    </p>

    <!-- Value Proposition Pill -->
    <div class="mt-space-md inline-flex items-center gap-space-xs px-space-md py-1.5 rounded-full bg-surface-container-low shadow-sm">
      <span class="material-symbols-outlined text-[15px] text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">verified</span>
      <span class="font-label-sm text-label-sm text-secondary tracking-tight">Technical Precision • Real-Time Stock • Traceable</span>
    </div>
  </div>

  <!-- Authentication Main Card -->
  <div class="w-full bg-surface-container-lowest rounded-xl shadow-md p-space-lg mb-space-md transition-all">
    <div class="mb-space-lg">
      <h1 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">Welcome back</h1>
      <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Sign in to your LabStock institutional account</p>
    </div>

    <form id="loginForm" class="flex flex-col gap-space-md" onsubmit="event.preventDefault(); handleLogin();">
      <!-- Input: Identity -->
      <div class="flex flex-col gap-space-xxs">
        <label for="username" class="font-label-md text-label-md text-on-surface font-medium flex items-center justify-between">
          <span>Username or Institutional Email</span>
          <span class="font-code-sm text-code-sm text-secondary">LDAP / SSO</span>
        </label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none transition-colors" id="userIcon">badge</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            value="lab.tech@eng.institution.edu"
            placeholder="lab.tech@eng.institution.edu"
            required
            class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline outline-none transition-all focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px] focus:shadow-on-tertiary-container"
          />
        </div>
      </div>

      <!-- Input: Credential -->
      <div class="flex flex-col gap-space-xxs">
        <div class="flex items-center justify-between">
          <label for="password" class="font-label-md text-label-md text-on-surface font-medium">Password</label>
          <button type="button" class="font-label-sm text-label-sm text-secondary hover:text-on-surface font-medium outline-none">Forgot key?</button>
        </div>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none transition-colors" id="lockIcon">lock</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••••••"
            value="LabTech-2024#Security"
            required
            class="w-full h-11 pl-10 pr-11 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline outline-none transition-all focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px] focus:shadow-on-tertiary-container font-code-md"
          />
          <button 
            type="button" 
            id="togglePassword" 
            aria-label="Toggle password visibility" 
            class="absolute right-2.5 flex items-center justify-center p-1.5 rounded-lg text-secondary hover:text-on-surface hover:bg-surface-container transition-colors outline-none"
            onclick="togglePasswordVisibility()"
          >
            <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility_off</span>
          </button>
        </div>
      </div>

      <!-- Remember Session Checkbox -->
      <div class="flex items-center justify-between pt-0.5">
        <label class="flex items-center gap-space-xs cursor-pointer select-none group">
          <input 
            type="checkbox" 
            id="rememberMe" 
            checked 
            class="sr-only peer"
          />
          <div class="w-[18px] h-[18px] rounded bg-surface-container-high peer-checked:bg-primary-container flex items-center justify-center transition-all group-hover:scale-105">
            <span class="material-symbols-outlined text-on-primary text-[14px] font-bold opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
          </div>
          <span class="font-label-md text-label-md text-on-surface-variant peer-checked:text-on-surface">Institutional Session</span>
        </label>
        <span class="font-code-sm text-code-sm text-on-tertiary-container bg-surface-container-high px-1.5 py-0.5 rounded">24h valid</span>
      </div>

      <!-- Action Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full h-12 mt-space-xs bg-primary-container hover:bg-inverse-surface active:scale-[0.99] text-on-primary font-headline-sm text-headline-sm font-semibold rounded-lg shadow-sm flex items-center justify-center gap-space-xs transition-all duration-150 outline-none"
      >
        <span class="material-symbols-outlined text-[20px]">login</span>
        <span>Sign In</span>
      </button>
    </form>

    <!-- Operational State Banner -->
    <div class="mt-space-lg pt-space-md bg-surface-container-low/60 rounded-lg p-space-sm flex items-center justify-between">
      <div class="flex items-center gap-space-xs min-w-0">
        <span class="relative flex h-2 w-2 flex-shrink-0">
          <span class="inline-flex rounded-full h-2 w-2 bg-on-tertiary-container"></span>
        </span>
        <span class="font-code-sm text-code-sm text-on-surface-variant truncate">FastAPI auth • SSL 256-bit encrypted</span>
      </div>
      <span class="material-symbols-outlined text-secondary text-[16px] flex-shrink-0 ml-1">shield</span>
    </div>
  </div>

  <!-- Support & Institutional Help -->
  <div class="flex flex-col items-center text-center gap-space-xs px-space-sm mb-space-lg">
    <div class="flex items-center gap-space-xs font-label-md text-label-md text-on-surface-variant">
      <span>Need access?</span>
      <a href="javascript:void(0)" onclick="notifyAdminModal()" class="text-on-primary-fixed-variant font-semibold underline underline-offset-2 hover:text-primary transition-colors">
        Contact Laboratory Administrator
      </a>
    </div>

    <!-- Quick Environment Telemetry -->
    <div class="flex items-center gap-space-md mt-space-xs text-secondary font-code-sm text-code-sm">
      <span class="flex items-center gap-1">
        <span class="material-symbols-outlined text-[13px]">dns</span>
        <span>Cluster: EU-WEST-LAB4</span>
      </span>
      <span class="text-outline">•</span>
      <span class="flex items-center gap-1">
        <span class="material-symbols-outlined text-[13px]">speed</span>
        <span>Ping: 18ms</span>
      </span>
    </div>
  </div>

  <!-- Technical Deployment Footer -->
  <div class="mt-auto flex flex-col items-center justify-center text-center pb-space-sm">
    <div class="font-code-sm text-code-sm text-secondary tracking-normal">
      LabStock v1.0.4-rc • Python Flet / FastAPI
    </div>
    <div class="font-label-sm text-label-sm text-outline mt-0.5">
      ISO 17025 Compliant Audit Logging Enabled
    </div>
  </div>

  <!-- Toast Notification Overlay -->
  <div id="toastNotification" class="fixed bottom-6 left-4 right-4 max-w-sm mx-auto bg-primary-container text-on-primary p-space-md rounded-xl shadow-xl flex items-center justify-between opacity-0 pointer-events-none transform translate-y-3 transition-all duration-300 z-50">
    <div class="flex items-center gap-space-sm">
      <span class="material-symbols-outlined text-tertiary-fixed text-[20px]" id="toastIcon">info</span>
      <span class="font-body-sm text-body-sm font-medium" id="toastMessage">Authenticating with institutional gateway...</span>
    </div>
    <button onclick="dismissToast()" class="text-secondary-fixed-dim hover:text-on-primary outline-none">
      <span class="material-symbols-outlined text-[18px]">close</span>
    </button>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility_off';
    }
  }

  function showToast(message, iconName = 'info') {
    const toast = document.getElementById('toastNotification');
    const msgEl = document.getElementById('toastMessage');
    const iconEl = document.getElementById('toastIcon');
    msgEl.textContent = message;
    iconEl.textContent = iconName;
    toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
    toast.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
    setTimeout(() => {
      dismissToast();
    }, 3800);
  }

  function dismissToast() {
    const toast = document.getElementById('toastNotification');
    toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
    toast.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
  }

  function notifyAdminModal() {
    showToast('Admin ticket dispatched: Help Desk queue #4092 assigned', 'contact_support');
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">sync</span><span>Verifying Credentials...</span>`;
    
    setTimeout(() => {
      showToast('FastAPI Token Granted. Synchronizing catalog cache...', 'task_alt');
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1200);
  }
</script></head><body></body></html>
